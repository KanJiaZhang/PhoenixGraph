<!doctype html>
<html lang="zh-CN">
<head><title>营销指标口径（Confluence 导出）</title></head>
<body>
<h1>营销指标口径</h1>
<p>本页由营销数据组维护，<strong>口径变更需评审</strong>。</p>
<h2>指标</h2>
<table>
  <tr><th>指标</th><th>口径</th><th>单位</th><th>别名</th><th>图属性</th></tr>
  <tr><td>营收</td><td>SUM(revenue)</td><td>元</td><td>收入、营业额</td><td>revenue</td></tr>
  <tr><td>花费</td><td>SUM(spend)</td><td>元</td><td>投放费用</td><td>spend</td></tr>
  <tr><td>点击率</td><td>100 * SUM(clicks) / SUM(impressions)</td><td>%</td><td>CTR</td><td></td></tr>
</table>
<h2>维度</h2>
<table>
  <tr><th>维度</th><th>字段</th><th>类型</th><th>图属性</th></tr>
  <tr><td>渠道</td><td>channel</td><td>VARCHAR(20)</td><td>channel</td></tr>
  <tr><td>地区</td><td>region</td><td>VARCHAR(20)</td><td>region</td></tr>
</table>
<h2>术语</h2>
<table>
  <tr><th>术语</th><th>说明</th><th>别名</th></tr>
  <tr><td>成交</td><td>用户完成支付且未退款的订单</td><td>GMV 口径</td></tr>
</table>
</body>
</html>
