spring:
  application:
    name: phoenixgraph-web
  web:
    resources:
      cache:
        cachecontrol:
          # the UI is edited while the service runs: a browser must never serve a copy of
          # app.js/style.css it cached from an earlier build. no-store is stronger than
          # no-cache (which only revalidates), so a page reload always picks up the latest.
          no-store: true

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,text/javascript

phoenixgraph:
  # graph-http backend the UI proxies /api/query and /api/graphs to
  http-url: http://localhost:8081
  # forwarded as Authorization: Bearer when the engine has security enabled
  api-key: ${PHOENIXGRAPH_API_KEY:}
