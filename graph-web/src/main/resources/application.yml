spring:
  application:
    name: phoenixgraph-web
  web:
    resources:
      cache:
        cachecontrol:
          # the UI is edited while the service runs: a browser must revalidate its copy of
          # app.js/style.css instead of serving the one it cached from an earlier build
          no-cache: true

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,text/javascript

phoenixgraph:
  # graph-http backend the UI proxies /api/query and /api/graphs to
  http-url: http://localhost:8081
