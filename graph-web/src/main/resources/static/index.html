<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhoenixGraph 可视化</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <defs>
            <linearGradient id="phxFire" x1="10" y1="44" x2="40" y2="4" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#fbbf24"/>
              <stop offset="0.45" stop-color="#fb7185"/>
              <stop offset="1" stop-color="#c084fc"/>
            </linearGradient>
          </defs>
          <g stroke="url(#phxFire)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M24 21 15 18 9 11 5 3"/>
            <path d="M15 18 9 22 4 21"/>
            <path d="M24 21 33 18 39 11 43 3"/>
            <path d="M33 18 39 22 44 21"/>
            <path d="M24 11V34"/>
            <path d="M24 34 18 42"/>
            <path d="M24 34V45"/>
            <path d="M24 34 30 42"/>
            <path d="M24 11 22 4"/>
            <path d="M24 11 27 5"/>
          </g>
          <path d="M24 11 30 12.5 24 14.5Z" fill="url(#phxFire)"/>
          <g fill="#ffffff">
            <circle cx="24" cy="11" r="2.8"/>
            <circle cx="24" cy="21" r="2.4"/>
            <circle cx="24" cy="34" r="2.4"/>
            <circle cx="15" cy="18" r="2"/>
            <circle cx="33" cy="18" r="2"/>
            <circle cx="5" cy="3" r="2"/>
            <circle cx="43" cy="3" r="2"/>
            <circle cx="9" cy="11" r="1.7"/>
            <circle cx="39" cy="11" r="1.7"/>
            <circle cx="18" cy="42" r="1.9"/>
            <circle cx="30" cy="42" r="1.9"/>
          </g>
        </svg>
      </span>
      <span class="brand-name">PhoenixGraph</span>
    </div>

    <div class="field">
      <label for="graphSelect" data-i18n="graph">图实例</label>
      <select id="graphSelect"></select>
    </div>

    <div class="field query-mode" id="idPanel">
      <label for="vertexTypeSelect" data-i18n="vertexType">顶点类型</label>
      <select id="vertexTypeSelect"></select>
      <input id="vertexIdInput" data-i18n-placeholder="vertexIdPlaceholder" placeholder="输入顶点 ID（多个用逗号分隔），如 888, 1000, 1001">
    </div>

    <div class="actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-opt" data-lang="zh">中</button>
        <button type="button" class="lang-opt" data-lang="en">EN</button>
      </div>
      <label class="switch" data-i18n-title="gremlinToggle" title="切换查询输入框">
        <input type="checkbox" id="modeToggle">
        <span class="slider"></span>
        <span class="switch-label">Query</span>
      </label>
      <select id="languageSelect" class="lang-select" data-i18n-title="queryLanguage" title="查询语言">
        <option value="gremlin">Gremlin</option>
        <!-- Cypher is hidden for now: the examples and the result tab are Gremlin-first. The option
             stays in the markup (hidden and disabled) so bringing it back is one attribute. -->
        <option value="cypher" hidden disabled>Cypher</option>
      </select>
      <a id="builderBtn" class="icon-btn" href="builder.html" title="图管理 · 建模" aria-label="graph builder"
         data-i18n-title="builder" data-i18n-aria-label="builder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V8m0 0 8-4 8 4v12M4 8l8 4 8-4M12 12v8"/>
        </svg>
      </a>
      <a class="icon-btn" href="map.html" title="三国地图 · 都城与战场" aria-label="三国地图">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/>
          <path d="M9 3v15M15 6v15"/>
        </svg>
      </a>
      <button id="fuzzyBtn" class="icon-btn" type="button" hidden
              data-i18n-title="fuzzyExample" data-i18n-aria-label="fuzzyExample"
              title="模糊关联示例" aria-label="模糊关联示例">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/>
          <path d="M8.2 7.2 10.6 15.6M15.8 7.2 13.4 15.6M8.5 6h7"/>
        </svg>
      </button>
      <button id="examplesBtn" class="icon-btn" type="button" aria-expanded="false"
              data-i18n-title="examples" title="示例查询" aria-label="examples">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <path d="M9 7h7M9 11h5"/>
        </svg>
      </button>
      <button id="queryBtn" class="btn-primary" data-i18n="query">查询</button>
    </div>

    <div class="query-mode gremlin-row" id="gremlinPanel" hidden>
      <textarea id="gremlinInput" rows="2"
                placeholder="g.V(888,'Account').batch(40).both('Payment').both('Payment')"></textarea>
      <label class="switch script-switch" id="scriptToggleWrap" hidden
             data-i18n-title="scriptToggle" title="Groovy 脚本模式">
        <input type="checkbox" id="scriptToggle">
        <span class="slider"></span>
        <span class="switch-label" data-i18n="scriptMode">脚本</span>
      </label>
      <select id="exampleSelect" class="example-select" data-i18n-title="examples" title="示例查询" hidden></select>
    </div>
  </header>

  <main id="main">
    <div id="canvasWrap">
      <div id="canvas" aria-label="graph canvas"></div>
      <div id="toolbar">
        <button id="rebalanceBtn" data-i18n-title="rebalance" title="自动平衡力图" aria-label="rebalance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
        </button>
        <button id="brushBtn" data-i18n-title="brush" title="框选过滤" aria-label="box select">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
          </svg>
        </button>
        <button id="resetViewBtn" data-i18n-title="showAll" title="显示全部" aria-label="show all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/><path d="M9 21H3v-6"/>
          </svg>
        </button>
        <span class="tool-sep"></span>
        <select id="algoSelect" data-i18n-title="algorithm" title="图算法着色">
          <option value="" data-i18n="algorithm">算法</option>
          <option value="louvain">Louvain</option>
          <option value="pagerank">PageRank</option>
          <option value="cc" data-i18n="cc">连通分量</option>
          <option value="shortestpath" data-i18n="shortestPath">最短路径</option>
        </select>
      </div>
      <div id="searchBox">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="searchInput" type="text" data-i18n-placeholder="searchPlaceholder" placeholder="搜索点 / 边关键词" autocomplete="off" spellcheck="false">
        <button id="searchClear" data-i18n-title="clearSearch" title="清除搜索" aria-label="clear search" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div id="valuePanel" class="value-panel" hidden role="status" aria-live="polite">
        <div class="value-head">
          <span class="value-title" id="valueTitle" data-i18n="valueTitle">结果值</span>
          <button id="valueCopy" class="value-btn" type="button" data-i18n-title="copy" title="复制">⧉</button>
          <button id="valueClose" class="value-btn" type="button" data-i18n-title="close" title="关闭">×</button>
        </div>
        <div class="value-body" id="valueBody"></div>
        <div class="value-detail" id="valueDetail"></div>
      </div>
      <div id="legendCount" class="legend-count" hidden role="status" aria-live="polite"></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>

    <aside id="sidePanel">
      <nav class="tabs">
        <button class="tab active" data-tab="stats" data-i18n="stats">统计</button>
        <button class="tab" data-tab="props" data-i18n="props">属性</button>
        <button class="tab" data-tab="rows" data-i18n="rows">结果</button>
        <button class="tab" data-tab="metrics" data-i18n="metrics">指标</button>
      </nav>
      <section id="rowsPanel" class="panel" hidden>
        <div id="rowsHint" class="muted" data-i18n="rowsHint">Cypher 查询结果会显示在这里</div>
        <div id="rowsTableWrap" class="rows-wrap" hidden>
          <table id="rowsTable" class="rows-table"></table>
        </div>
      </section>
      <section id="statsPanel" class="panel">
        <div class="stat-grid">
          <div class="stat-card">
            <span class="stat-value" id="vertexCount">0</span>
            <span class="stat-label" data-i18n="vertices">顶点</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="edgeCount">0</span>
            <span class="stat-label" data-i18n="edges">边</span>
          </div>
        </div>
        <div id="typeBreakdown" class="type-breakdown"></div>
        <button id="exportBtn" class="export-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
          </svg>
          <span data-i18n="exportCsv">导出 CSV</span>
        </button>
      </section>
      <section id="propsPanel" class="panel" hidden>
        <p class="muted" id="propsHint" data-i18n="propsHint">点击图中某点或某边查看其全部属性</p>
        <div id="propsContent"></div>
      </section>
      <section id="metricsPanel" class="panel" hidden>
        <div class="metrics-head">
          <span class="metrics-graph" id="metricsGraph">—</span>
          <span class="metrics-updated" id="metricsUpdated"></span>
          <button id="metricsRefresh" class="icon-btn" type="button" title="刷新" data-i18n-title="metricsRefresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
            </svg>
          </button>
        </div>
        <div id="metricsBody" class="metrics-body">
          <p class="muted" data-i18n="metricsHint">正在读取系统指标…</p>
        </div>
      </section>
    </aside>
  </main>

  <div id="errorModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="errorModal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="errorModalTitle">
      <header class="modal-head">
        <span class="modal-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>
            <path d="M12 9v4"/><path d="M12 17h.01"/>
          </svg>
        </span>
        <h2 id="errorModalTitle" data-i18n="queryErrorTitle">Gremlin 查询失败</h2>
        <button type="button" class="modal-close" data-close="errorModal" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </header>
      <p class="modal-hint" id="errorModalHint" data-i18n="queryErrorHint">
        请检查 Gremlin Query 是否写正确
      </p>
      <div class="modal-body">
        <div class="modal-row">
          <span class="modal-key" data-i18n="errorMessage">错误信息</span>
          <code class="modal-message" id="errorModalMessage"></code>
        </div>
        <div class="modal-row" id="errorModalQueryRow">
          <span class="modal-key" data-i18n="errorQuery">出错查询</span>
          <pre class="modal-query" id="errorModalQuery"></pre>
        </div>
        <details class="modal-trace" id="errorModalTraceBox">
          <summary data-i18n="errorStackTrace">异常堆栈</summary>
          <pre id="errorModalTrace"></pre>
        </details>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn" id="errorModalCopy" data-i18n="copy">复制</button>
        <button type="button" class="btn btn-primary" data-close="errorModal" data-i18n="close">关闭</button>
      </footer>
    </div>
  </div>

  <script src="/vendor/d3/d3.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
