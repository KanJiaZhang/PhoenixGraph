<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhoenixGraph 可视化</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <span>PhoenixGraph</span>
    </div>

    <div class="field">
      <label for="graphSelect">图实例</label>
      <select id="graphSelect"></select>
    </div>

    <div class="field query-mode" id="idPanel">
      <label for="vertexTypeSelect">顶点类型</label>
      <select id="vertexTypeSelect"></select>
      <input id="vertexIdInput" placeholder="输入顶点 ID，如 888">
    </div>

    <div class="actions">
      <label class="switch" title="切换 Gremlin 查询输入框">
        <input type="checkbox" id="modeToggle">
        <span class="slider"></span>
        <span class="switch-label">Gremlin</span>
      </label>
      <button id="queryBtn">查询</button>
    </div>

    <div class="query-mode gremlin-row" id="gremlinPanel" hidden>
      <textarea id="gremlinInput" rows="3"
                placeholder="g.V(888,'Account').batch(40).both('Payment').both('Payment')"></textarea>
    </div>
  </header>

  <main id="main">
    <div id="canvasWrap">
      <div id="canvas" aria-label="graph canvas"></div>
      <div id="toolbar">
        <button id="rebalanceBtn" title="自动平衡力图">↻</button>
        <button id="brushBtn" title="框选过滤">⛶</button>
        <button id="resetViewBtn" title="显示全部">⊞</button>
        <select id="algoSelect" title="图算法着色">
          <option value="">算法</option>
          <option value="louvain">Louvain</option>
          <option value="pagerank">PageRank</option>
          <option value="cc">连通分量</option>
        </select>
      </div>
    </div>

    <aside id="sidePanel">
      <nav class="tabs">
        <button class="tab active" data-tab="stats">统计</button>
        <button class="tab" data-tab="props">属性</button>
      </nav>
      <section id="statsPanel" class="panel">
        <p>点：<b id="vertexCount">0</b></p>
        <p>边：<b id="edgeCount">0</b></p>
      </section>
      <section id="propsPanel" class="panel" hidden>
        <p class="muted" id="propsHint">点击图中某点或某边查看其全部属性</p>
        <div id="propsContent"></div>
      </section>
    </aside>
  </main>

  <script src="/vendor/d3/d3.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
