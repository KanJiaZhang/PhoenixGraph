<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三国地图 · PhoenixGraph</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; }
    .legend {
      position: absolute; z-index: 1000; left: 12px; bottom: 24px;
      background: #fff; border-radius: 8px; padding: 10px 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,.25); font: 13px/1.7 system-ui, sans-serif;
    }
    .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; }
    .hint {
      position: absolute; z-index: 1000; top: 12px; left: 12px;
      background: #fff; border-radius: 8px; padding: 8px 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,.25); font: 13px/1.6 system-ui, sans-serif; max-width: 260px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="hint" id="hint">正在从 sanguo-kg-text 加载坐标…</div>
  <div class="legend">
    <i style="background:#2563eb"></i>都城 / 城市（Place）<br>
    <i style="background:#e11d48"></i>战役 / 事件（Event）
  </div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
