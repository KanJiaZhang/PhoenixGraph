<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhoenixGraph 可视化</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>
        </svg>
      </span>
      <span class="brand-name">PhoenixGraph</span>
    </div>

    <div class="field">
      <label for="graphSelect">图实例</label>
      <select id="graphSelect"></select>
    </div>

    <div class="field query-mode" id="idPanel">
      <label for="vertexTypeSelect">顶点类型</label>
      <select id="vertexTypeSelect"></select>
      <input id="vertexIdInput" placeholder="输入顶点 ID，如 888">
    </div>

    <div class="actions">
      <label class="switch" title="切换 Gremlin 查询输入框">
        <input type="checkbox" id="modeToggle">
        <span class="slider"></span>
        <span class="switch-label">Gremlin</span>
      </label>
      <button id="queryBtn" class="btn-primary">查询</button>
    </div>

    <div class="query-mode gremlin-row" id="gremlinPanel" hidden>
      <textarea id="gremlinInput" rows="1"
                placeholder="g.V(888,'Account').batch(40).both('Payment').both('Payment')"></textarea>
    </div>
  </header>

  <main id="main">
    <div id="canvasWrap">
      <div id="canvas" aria-label="graph canvas"></div>
      <div id="toolbar">
        <button id="rebalanceBtn" title="自动平衡力图" aria-label="自动平衡">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
        </button>
        <button id="brushBtn" title="框选过滤" aria-label="框选">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
          </svg>
        </button>
        <button id="resetViewBtn" title="显示全部" aria-label="显示全部">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/><path d="M9 21H3v-6"/>
          </svg>
        </button>
        <span class="tool-sep"></span>
        <select id="algoSelect" title="图算法着色">
          <option value="">算法</option>
          <option value="louvain">Louvain</option>
          <option value="pagerank">PageRank</option>
          <option value="cc">连通分量</option>
        </select>
      </div>
      <div id="searchBox">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="searchInput" type="text" placeholder="搜索点 / 边关键词" autocomplete="off" spellcheck="false">
        <button id="searchClear" title="清除搜索" aria-label="清除搜索" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <aside id="sidePanel">
      <nav class="tabs">
        <button class="tab active" data-tab="stats">统计</button>
        <button class="tab" data-tab="props">属性</button>
      </nav>
      <section id="statsPanel" class="panel">
        <div class="stat-grid">
          <div class="stat-card">
            <span class="stat-value" id="vertexCount">0</span>
            <span class="stat-label">顶点</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="edgeCount">0</span>
            <span class="stat-label">边</span>
          </div>
        </div>
      </section>
      <section id="propsPanel" class="panel" hidden>
        <p class="muted" id="propsHint">点击图中某点或某边查看其全部属性</p>
        <div id="propsContent"></div>
      </section>
    </aside>
  </main>

  <script src="/vendor/d3/d3.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
