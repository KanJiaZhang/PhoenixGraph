<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 图视图 · PhoenixGraph</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }
    #bar {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      border-bottom: 1px solid var(--border); background: var(--surface); flex: none;
    }
    #bar select, #bar input {
      height: 34px; border: 1px solid var(--border); border-radius: 9px; padding: 0 10px;
      font: 13px system-ui, sans-serif; color: var(--text-2); background: #fff;
    }
    #bar input#query { flex: 1; min-width: 200px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    #bar button {
      height: 34px; padding: 0 14px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--accent); color: #fff; font: 600 13px system-ui, sans-serif; cursor: pointer;
    }
    #bar .hint { font: 12px system-ui, sans-serif; color: var(--muted); }
    #stage { position: relative; flex: 1; min-height: 0; background: radial-gradient(1200px 700px at 50% -10%, #101628, #070a12); }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    #status {
      position: absolute; left: 14px; bottom: 14px; color: #cbd5e1;
      font: 12px/1.7 ui-monospace, Menlo, Consolas, monospace; white-space: pre;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }
  </style>
</head>
<body>
  <div id="bar">
    <select id="graphSelect" title="图实例"></select>
    <input id="query" spellcheck="false" value="g.V('1000','Account').both('Payment').both('Payment').dedup()">
    <button id="draw">绘制</button>
    <span class="hint">拖动旋转 · 滚轮缩放 · 深度越近越亮越大（无 WebGL、无新依赖，仅 canvas 2D 投影）</span>
  </div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="status">正在加载…</div>
  </div>
  <script src="js/graph3d.js"></script>
</body>
</html>
