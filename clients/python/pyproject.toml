[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenixgraph-client"
version = "0.1.0"
description = "Zero-dependency Python client for the PhoenixGraph HTTP API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "PhoenixGraph" }]
keywords = ["graph", "knowledge-graph", "rag", "ai-agents", "mcp"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KanJiaZhang/PhoenixGraph"
Documentation = "https://github.com/KanJiaZhang/PhoenixGraph/blob/develop/docs/API.md"

[tool.setuptools]
packages = ["phoenixgraph"]
