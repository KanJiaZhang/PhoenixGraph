# HNSW-only profile: serves the vector index of the SIFT small dataset as the only
# graph (one Vector vertex type plus the layer edge classes vector_0..vector_14).
# The default profile already serves it *alongside* payment-graph and the
# knowledge graph; this profile is for a lighter instance that only needs vectors.
#
#   java -jar graph-http/target/graph-http-0.1.0-SNAPSHOT.jar --spring.profiles.active=hnsw
#
# Query it with the vector-search step, e.g.
#   g.V('4242','Vector').nearest(20)              # 20 nearest vectors of that row
#   g.V('4242','Vector').nearest(20, 200)         # wider candidate list (more accurate)
#   g.V('4242','Vector').nearest(20).values('name')
#
phoenixgraph:
  storage:
    vertex-set: hnsw_sift_v1
    schema: hnsw-sift
    graphs: []
