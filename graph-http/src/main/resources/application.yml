spring:
  application:
    name: phoenixgraph-http
  lifecycle:
    # how long a graceful shutdown waits for in-flight requests before it gives up
    timeout-per-shutdown-phase: 30s
  web:
    resources:
      cache:
        cachecontrol:
          # the UI is edited while the service runs: a browser must never serve a copy of
          # app.js/style.css it cached from an earlier build
          no-store: true

server:
  port: 8081
  # Graceful shutdown: the container stops accepting new requests, lets the in-flight ones finish (up to the
  # lifecycle timeout below), and only then closes the storage beans - which is the order that lets the last
  # metrics flush reach the store. Without this a restart can drop up to a flush interval of counters and cut
  # a long query in half.
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/xml
    min-response-size: 1024

phoenixgraph:
  storage:
    host: localhost
    port: 3000
    # optional seed list (host:port); overrides host/port for cluster discovery
    # seeds: [aerospike-1:3000, aerospike-2:3000]
    namespace: test
    # primary graph: used by the write endpoints; the demo links (IP/Phone -> Account) are
    # single-direction in http_demo_v3, so a UI draws one directed edge per link
    vertex-set: http_demo_v3
    schema: payment-graph
    # RocksDB graphs resolve their (relative) schema paths against this directory
    rocksdb-root: .rocksdb
    # further graphs served by the same instance; the UI lists all of them and
    # each one reads its own storage. The dashboard shows four graphs for now:
    # the primary payment-graph above, the aggregated-edge form, the RocksDB-Edge
    # form of the same data, and the knowledge graph. The others (a second RocksDB
    # scheme, the geo demo, the two vector demos and the smart graphs) still ship
    # with the repo - uncomment them to serve them again.
    graphs:
      # the payment graph with its big vertices in the aggregated Edge_Out / Edge_In tables
      # (loaded by AerospikeEdgeDemoLoader); a query on a hub needs a time window:
      # g.V('9000001','Account').createdBetween('2025-06-01','2025-06-02').inE('Payment').limit(500)
      - schema: payment-graph-as-edge
        vertex-set: payment_as_edge_v1
      # the same payment data in the RocksDB-Edge scheme (loaded by
      # PaymentGraphRocksDbLoader); it carries a vector and a location on every
      # account, so the vector and geo steps answer here too:
      #   g.V('1001','Account').nearest(5).outE('Payment')
      #   g.V('1001','Account').circle('{"latitude":31.2304,"longitude":121.4737}', 5000).limit(10)
      - schema: payment-graph-rocksdb-edge
        vertex-set: http_demo_v3
      - schema: kg-entity-graph
        vertex-set: kg_nell995_v2
      # 《三国演义》knowledge graph (relation-sharded like kg-entity-graph, but with a
      # typed Entity vertex and relation/xrelation/relationLabel/relationFamily on the
      # edge); loaded by SanguoGraphIntegrationTest:
      #   g.V('曹操_3','Entity').bothE().filter(relation.equals('lord') || xrelation.equals('lord'))
      #   g.V('诸葛亮_3','Entity').bothE().filter(relation.equals('minister')).otherV()
      - schema: sanguo-kg
        vertex-set: kg_sanguo_v1
      # the same 《三国演义》 graph served by RocksDB-Edge: the vertex id is the plain
      # entity name (no relation shard) and the edges live in an edge table, so one
      # person is one record. Loaded by SanguoRocksDbEdgeTest / SanguoRocksDbLoader:
      #   g.V('曹操','Entity').bothE().filter(relation.equals('lord') || xrelation.equals('lord'))
      #   g.V('姜维','Entity').bothE().filter(xrelation.equals('master')).otherV()
      - schema: sanguo-kg-rocksdb-edge
        vertex-set: kg_sanguo_v1
      # the agent toolkit's example graph: built from docs/agent-demo/*.md by
      #   POST /api/v1/agent/ingest {"graph":"agent-demo", ...}
      # (see docs/AI-TOOLKIT.md); it holds the extracted entities, the
      # relations with their provenance sentences, the chunks, and one embedding per entity,
      # so find_entities/similar answer with the vector index the write path maintains
      - schema: agent-demo
        vertex-set: agent_demo_v2
      # 方案 C：同一份数据 + 从文档自由文本（历史/小说）抽出的实体与关系，也是 RocksDB-Edge。
      # 比 sanguo-kg-rocksdb-edge 多 ~42 实体 / ~969 关系（mentions / holds / 军师 / 谋士 / 交战 / 斩杀），
      # 由 SanguoTextGraphTest / SanguoTextGraph 装载（.rocksdb/sanguo-kg-text）：
      #   g.V('五虎上将','Entity').inE().filter(relation.equals('holds')).otherV().values('name')
      #   g.V('刘备','Entity').inE().filter(relation.equals('strategistOf')).otherV().values('name')
      - schema: sanguo-kg-text
        vertex-set: kg_sanguo_v1
      # 企业 data agent 的语义层（TPC-H，RocksDB-Edge）：表 / 字段 / 指标 / 维度 / 业务域 / 查询 都是节点，
      # 关系承载血缘（computedFrom / usesColumn / readsTable）与归因（contributesTo）。
      # 由 TpchDataAgentGraphTest / TpchDataAgentGraph 装载（.rocksdb/tpc-h-analytics）：
      #   g.V('metric/revenue','Node').values('aggFunction','expression','unit')
      #   g.V('metric/revenue','Node').outE().filter(relation.equals('computedFrom')).otherV().values('name')
      #   g.V('metric/revenue','Node').inE().filter(relation.equals('contributesTo')).otherV().values('name')
      #   g.V('metric/revenue','Node').outE().filter(relation.equals('definedBy')).otherV().values('sqlText')
      - schema: tpc-h-analytics
        vertex-set: tpc_h_analytics_v1
      # TPC-H 数据实例（语义层 tpc-h-analytics 的行数据）：物化的订单行事实 Sale（含反规范化的维度
      # 与预计算指标）+ 星型模型边（ofPart/ofSupplier/ofOrder/placedBy/customerNation/nationRegion）。
      # 由 TpchDataGraphTest / TpchDataGraph 装载（.rocksdb/tpc-h-data）：
      #   g.V('Sale').group().by('region').by(values('revenue').sum())
      #   g.V('Sale').values('revenue').sum()
      #   g.V('sale_0','Sale').out('ofOrder').out('placedBy').out('customerNation').out('nationRegion').values('name')
      - schema: tpc-h-data
        vertex-set: tpc_h_data_v1
      # 营销 demo 的语义层（demo-semantics）：表 / 字段 / 指标 / 维度 都是节点，关系承载血缘与维度。
      # 每个指标的 graphProperty 与同义词 alias 直接写在节点上（S1 最终形态）。
      # 由 DemoMarketingGraphTest / DemoMarketingGraph 装载（.rocksdb/demo-semantics）：
      #   g.V('metric/spend','Node').values('graphProperty','aggFunction','unit')
      #   g.V('metric/cac','Node').values('expression')   # 比率指标：无 graphProperty，拒答并给 SQL
      - schema: demo-semantics
      # 营销 demo 的事实数据（demo-data）：MarketingDay 顶点（反规范化的渠道/活动/地区维度与
      # 花费/曝光/点击/收入/GMV/新客指标）。由 DemoMarketingGraphTest / DemoMarketingGraph 装载（.rocksdb/demo-data）：
      #   g.V('MarketingDay').group().by('channel').by(values('spend').sum())
      - schema: demo-data
      # the smart payment graph: accounts and merchants carry a profile vector (embedding) and a
      # home location (location), so a vector search, a geo search and a graph walk compose in one
      # traversal. Loaded by SmartPaymentGraphLiveLoadTest into RocksDB-Inline:
      #   g.V('m1','Merchant').circle('{"latitude":31.2304,"longitude":121.4737}', 3000).limit(5)
      #     .nearest(2).in('Visited').dedup().outE('Payment').otherV().limit(60)
      - schema: payment-graph-smart-rocksdb
        vertex-set: payment_smart_v1

    # --- the graphs the dashboard hides for now ---------------------------------
    # - schema: payment-graph-rocksdb-inline
    #   vertex-set: http_demo_v3
    # - schema: geo-merchants-rocksdb-inline
    #   vertex-set: http_demo_v2
    # - schema: geo-merchants-rocksdb-edge
    #   vertex-set: http_demo_v2
    # - schema: hnsw-sift
    #   vertex-set: hnsw_sift_v1
    # - schema: hnsw-dynamic
    #   vertex-set: hnsw_dynamic_v1
    # - schema: payment-graph-smart
    #   vertex-set: payment_smart_v1
    # - schema: payment-graph-smart-rocksdb
    #   vertex-set: payment_smart_v1

  audit:
    # append-only JSONL; blank keeps the trail in the audit logger and the bounded in-memory view only
    file: ${PHOENIXGRAPH_AUDIT_FILE:}
    max-bytes: 10485760
    keep-files: 5

  agent:
    # --- the agent toolkit's embedder -------------------------------------------
    # hashing (default) is deterministic and offline. `http` calls an OpenAI-compatible
    # POST <base-url>/embeddings; the artifact records the model, so queries use the same vector space.
    # optional directory of <name>.json rule packs; a file there wins over the classpath
    rules-dir: ${PHOENIXGRAPH_AGENT_RULES_DIR:}
    embedding:
      provider: hashing
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      model: text-embedding-3-small
      dimensions: 768
      timeout-seconds: 30

    # the final ordering step; `http` calls POST <base-url>/rerank (Cohere/Jina compatible)
    reranker:
      provider: none
      base-url: https://api.cohere.com/v1
      api-key: ${COHERE_API_KEY:}
      model: rerank-v3.5
      timeout-seconds: 10

    # --- request limits (see docs/API.md and docs/ROADMAP-1.0.md M2) ---
    # One instance has a fixed number of threads and connections; these are the numbers that keep one
    # expensive or hostile request from spending them for everybody else. The defaults are conservative
    # enough for a demo instance, and a deployment that needs more says so here.
  limits:
    enabled: true
    max-concurrent: 64        # requests in flight on this instance
    queue-wait: 2s            # how long a request waits for a slot before it is refused
    per-graph-concurrent: 8   # one hot graph cannot take the whole instance
    per-graph-per-second: 200 # 0 switches the rate limit off
    per-tenant-concurrent: 0  # requests in flight per tenant; 0 switches the tenant limit off
    per-tenant-per-second: 0  # requests per second per tenant; 0 switches the tenant limit off
    request-timeout: 30s      # wall clock a query may run; the engine checks it between steps
    retry-after-seconds: 1    # what a 429/503 answer tells the client to wait

  # --- the write path and the error body (see docs/API.md §5, §10) ---
  write:
    # An edge whose source or destination vertex is not in the graph is refused with a 400. The store can
    # always write it (an edge lives in its endpoints' records, so a missing endpoint becomes an untyped
    # stub), and that is the trap: a typo in an id silently materialises a vertex with no type, which shows
    # up in scans and in elementMap() with no properties, and nothing said so. A loader that deliberately
    # imports edges before vertices sets this to false.
    require-existing-endpoints: true
    max-property-value-bytes: 524288   # 512 KiB; a single value larger than this is a 400, not a store error

  errors:
    # Only for a debugging instance. A stack trace in a response body names absolute paths, library versions
    # and the shape of the code, and a client cannot act on the frames; the 500 body points at the request id
    # and the log instead, which is what makes it reportable.
    include-stack-trace: false

  # --- who may call (see docs/API.md §2) ---
  # Off by default: a local `docker compose up`, the UI and the verification suite must work without
  # ceremony. Turn it on before the port is reachable by anyone else - the README's Limitations section says
  # why, and docs/ROADMAP-1.0.md M2-2 is where this landed.
  security:
    enabled: false
    # Each key: name (what the audit log calls it), token (or its sha256), role, and optionally the graphs it
    # may name. Roles are a ladder: reader < writer < admin; schema authoring, ingestion, index rebuilds,
    # metric resets and the audit view need admin. An empty graph list means every graph.
    keys: []
    #  - name: dashboard
    #    token: ${PHOENIXGRAPH_DASHBOARD_TOKEN}
    #    role: writer
    #    graphs: [payment-graph, payment-graph-rocksdb-edge]
    #  - name: ops
    #    sha256: ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad   # echo -n abc | sha256sum
    #    role: admin

  # --- TLS (see docs/API.md §2) ---
  # Uncomment and point at a real keystore to serve HTTPS. The password comes from the environment
  # (PHOENIXGRAPH_TLS_PASSWORD), never from this file: a configuration file is read by more people than a
  # secret should be. Generate a self-signed one for a test with:
  #   keytool -genkeypair -alias phoenixgraph -keyalg RSA -keysize 2048 -storetype PKCS12 \
  #     -keystore phoenixgraph.p12 -storepass "$PHOENIXGRAPH_TLS_PASSWORD" \
  #     -dname "CN=localhost" -validity 365 -ext SAN=dns:localhost,ip:127.0.0.1
#server:
#  ssl:
#    enabled: true
#    key-store: /etc/phoenixgraph/phoenixgraph.p12
#    key-store-type: PKCS12
#    key-alias: phoenixgraph
#    key-store-password: ${PHOENIXGRAPH_TLS_PASSWORD}
