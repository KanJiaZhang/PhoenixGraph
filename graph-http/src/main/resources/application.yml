spring:
  application:
    name: phoenixgraph-http

server:
  port: 8081

phoenixgraph:
  storage:
    host: localhost
    port: 3000
    namespace: test
    vertex-set: vertices
    # optional graph schema name; the edge max in-/out-degree is read from the
    # schema file (graph-schema JSON) rather than being hard-coded here.
    schema: payment-graph
