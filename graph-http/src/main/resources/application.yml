spring:
  application:
    name: phoenixgraph-http

server:
  port: 8081
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/xml
    min-response-size: 1024

phoenixgraph:
  storage:
    host: localhost
    port: 3000
    namespace: test
    # primary graph: used by the write endpoints
    vertex-set: http_demo_v1
    schema: payment-graph
    # RocksDB graphs resolve their (relative) schema paths against this directory
    rocksdb-root: .rocksdb
    # further graphs served by the same instance; the UI lists all of them and
    # each one reads its own Aerospike vertex set
    graphs:
      # the same payment graph served by the two RocksDB storage schemes (see
      # PaymentGraphRocksDbLoader for loading the demo data into them)
      - schema: payment-graph-rocksdb-inline
        vertex-set: http_demo_v1
      - schema: payment-graph-rocksdb-edge
        vertex-set: http_demo_v1
      # shops around People's Square with an S2 geo index, in both RocksDB schemes:
      # g.V('1','Merchant').geoNear('{"lat":31.2304,"lon":121.4737,"radiusKm":1}')
      - schema: geo-merchants-rocksdb-inline
        vertex-set: http_demo_v1
      - schema: geo-merchants-rocksdb-edge
        vertex-set: http_demo_v1
      - schema: kg-entity-graph
        vertex-set: kg_nell995_v2
      # HNSW vector index of the SIFT small dataset (10,000 x 128); its schema
      # declares the layer edge classes vector_0..vector_14, so the query engine
      # exposes the vector-search step: g.V('4242','Vector').nearest(20)
      - schema: hnsw-sift
        vertex-set: hnsw_sift_v1
      # vector graph whose schema declares *only* isVector: its layer edge classes
      # are created while the index grows (see the hnsw-dynamic profile for writes)
      - schema: hnsw-dynamic
        vertex-set: hnsw_dynamic_v1
