spring:
  application:
    name: phoenixgraph-http

server:
  port: 8081
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/xml
    min-response-size: 1024

phoenixgraph:
  storage:
    host: localhost
    port: 3000
    namespace: test
    # primary graph: used by the write endpoints
    vertex-set: http_demo_v1
    schema: payment-graph
    # further graphs served by the same instance; the UI lists all of them and
    # each one reads its own Aerospike vertex set
    graphs:
      - schema: kg-entity-graph
        vertex-set: kg_nell995_v2
