# Knowledge-graph-only profile: serves the NELL-995 knowledge graph as the only
# graph (10-way relation sharding over a single Entity vertex type). The default
# profile already serves it *alongside* payment-graph; this profile is for a
# lighter instance that only needs the knowledge graph.
#
#   java -jar graph-http/target/graph-http-0.1.0-SNAPSHOT.jar --spring.profiles.active=kg
#
phoenixgraph:
  storage:
    vertex-set: kg_nell995_v2
    schema: kg-entity-graph
    graphs: []
