# Everything that has to pass before a commit can be called done.
#
# Four jobs, in the order a reviewer would want them:
#
#   unit         the unit tests of the modules that need no external service, plus the two checks
#                that keep the documentation honest (the endpoint table is generated, so it cannot drift)
#   python-sdk   the Python client's tests (a local HTTP server, no service needed)
#   typescript-sdk the TypeScript client's build and tests (a local HTTP server, no service needed)
#   deployment   the container path: build the images, start the stack, smoke it over HTTP and run the
#                three-minute demo - the same path QUICKSTART.md tells a stranger to take
#   nightly      the live verification suite against a *seeded* stack. It is scheduled rather than run per
#                push because seeding is the slow part (the demo loaders build 11k-vertex graphs and a HNSW
#                index); per push the unit job plus the deployment smoke is what a contributor waits for.
#
# Nothing here needs a secret: the repository is public and the images are the pinned Aerospike build.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'      # nightly: the full live verification suite
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests + generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The integration module needs a live store and pre-loaded data; it has its own job below.
      - name: Unit tests (20 modules, no external service)
        run: |
          MODULES=$(grep -o '<module>[^<]*' pom.xml | sed 's/<module>//' | grep -v graph-integration-test | paste -sd, -)
          ./mvnw -B -ntp test -pl "$MODULES"

      - name: docs/API.md matches the controllers
        run: node tools/api-endpoints.mjs --check

      - name: docs/openapi.json matches the controllers
        run: node tools/openapi.mjs --check

      - name: the verification suite is intact
        run: node verification/run.mjs --list

      - name: connector tests (local mock servers)
        run: node --test tools/connectors/*.test.mjs

      - name: MCP HTTP tests (local mock API)
        run: node --test tools/mcp-server.test.mjs

      # the pi extension of docs/PI-PLUGIN.md: a fake pi, a fake ctx and a fake fetch, so P0 and P1 are asserted
      # without a running service or a model
      - name: pi extension tests (fake pi, fake API)
        run: node --test extensions/phoenixgraph/test/*.test.mjs

      # --expect-untagged because CI runs on every push, including the commit that bumps the version before the
      # tag exists: every fact that does not depend on the tag is still enforced here
      - name: the release state agrees with itself
        run: node tools/check-release.mjs --expect-untagged

      - name: the CI workflow itself is coherent
        run: node tools/check-ci.mjs

      - name: the kubernetes manifests are coherent
        run: node tools/check-k8s.mjs

  python-sdk:
    name: python sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the client
        run: python -m pip install -e clients/python
      - name: Compile and test (local HTTP server, no service)
        run: |
          python -m compileall -q clients/python/phoenixgraph clients/python/tests
          python -m unittest discover -s clients/python/tests -v
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build clients/python

  typescript-sdk:
    name: typescript sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Install, build and test (local HTTP server, no service)
        working-directory: clients/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

  deployment:
    name: container path (build, start, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Build the images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke it over HTTP
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS localhost:8081/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS localhost:8081/api/v1/health
          curl -fsS localhost:8081/api/v1/graphs | head -c 200
          # the UI starts after the API reports healthy (depends_on: service_healthy), so it needs its own wait:
          # curl'ing it straight after the API answers is a race that fails with "Recv failure"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null localhost:8080/ 2>/dev/null; then break; fi
            sleep 5
          done
          curl -fsS -o /dev/null localhost:8080/
          # an unknown path must be a 404 with an error body, not a 500 (docs/API.md)
          code=$(curl -s -o /tmp/nope.json -w '%{http_code}' localhost:8081/api/v1/nope)
          test "$code" = "404"
          grep -q '"error"' /tmp/nope.json
      - name: Three-minute demo (ingest, cited answer, refusal)
        run: node examples/three-minute-demo/demo.mjs
      - name: Business document CLI (rule pack + hybrid search)
        run: |
          set -e
          node tools/ingest-docs.mjs examples/business-demo/documents \
            --graph incident-ci --rule-pack incident \
            --dictionary examples/business-demo/dictionary.json --apply
          curl -fsS -X POST localhost:8081/api/v1/agent/search \
            -H 'content-type: application/json' \
            -d '{"graph":"incident-ci","question":"why did the checkout-api go out","k":3}' \
            | grep -q 'checkout-api'
      - name: Logs on failure
        if: failure()
        run: |
          # A failing step here says what did not answer; this says why. Container states and health values, the
          # store's own log (did it start? did the probe see it?), the API's, and what the runner had.
          docker compose ps -a || true
          for container in $(docker compose ps -aq); do
            docker inspect -f '{{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" || true
          done
          docker compose logs --no-color --tail 200 aerospike || true
          docker compose logs --no-color --tail 120
      - name: Stop
        if: always()
        run: docker compose down -v

  nightly:
    name: live verification suite (seeded stack)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      aerospike:
        image: aerospike/aerospike-server:8.1.2.5
        ports: ['3000:3000']
        options: >-
          --health-cmd "asinfo -v status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: ./mvnw -B -ntp -DskipTests package
      - name: Start the drill cluster (two nodes, replication-factor 2)
        run: |
          docker compose -f deploy/aerospike-cluster/docker-compose.yml up -d
          for i in $(seq 1 30); do
            docker exec aerospike-1 asinfo -v statistics | grep -q "cluster_size=2" && break
            sleep 2
          done
          docker exec aerospike-1 asinfo -v statistics | grep cluster_size

      - name: Start the engine and the UI
        run: |
          nohup java -jar graph-http/target/graph-http-*.jar > /tmp/http.log 2>&1 &
          nohup java -jar graph-web/target/graph-web-*.jar > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8081/api/v1/graphs >/dev/null && break; sleep 5; done
      - name: Seed the demo data (the loaders are the tests that write it)
        run: |
          ./mvnw -B -ntp -pl graph-integration-test -am test \
            -Dtest='SanguoRocksDbEdgeTest,TpchDataGraphTest,TpchDataAgentGraphTest' \
            -Dsurefire.failIfNoSpecifiedTests=false

      # The browser is what half the suite drives; playwright's chromium is the portable choice here.
      - name: Install a Chromium for the UI checks
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          echo "PG_BROWSER=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: "Run every live check (strict: a flake fails the job)"
        run: node verification/run.mjs --retry 0
