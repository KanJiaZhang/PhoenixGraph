# Build and publish the Python client to PyPI on a release tag.
#
# Requires a repository secret PYPI_API_TOKEN (or configure PyPI trusted publishing and switch the
# publish step to `permissions: id-token: write`). The client version is clients/python/pyproject.toml,
# independent of the server tag.
name: publish-python

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build clients/python
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: clients/python/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
