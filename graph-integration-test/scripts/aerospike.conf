service {
  user root
  group root
}

logging {
  file /var/log/aerospike.log {
    context any info
  }
}

network {
  service {
    address any
    port 3000
  }
  heartbeat {
    mode multicast
    address 239.1.99.222
    port 9918
  }
}

namespace test {
  replication-factor 1
  memory-size 1G
  default-ttl 0
}
