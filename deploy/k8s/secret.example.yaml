# The secrets this deployment needs, with placeholder values.
#
# Do not commit filled-in versions of this file. Create it from your secret manager instead:
#
#   kubectl create secret generic phoenixgraph-secrets \
#     --from-literal=PHOENIXGRAPH_API_KEYS=... \
#     --from-literal=PHOENIXGRAPH_TLS_PASSWORD=...
#
# (or keep it in git as an *example* like this one, and let a sealed-secrets / external-secrets controller
# fill the real values in).
apiVersion: v1
kind: Secret
metadata:
  name: phoenixgraph-secrets
  labels:
    app.kubernetes.io/name: phoenixgraph
type: Opaque
stringData:
  # one or more keys, as the YAML list phoenixgraph.security.keys expects; a key may carry its token or its
  # SHA-256 (printf %s <token> | sha256sum), a role and the graphs it may name
  PHOENIXGRAPH_SECURITY_KEYS: |
    - name: dashboard
      token: replace-me-dashboard-token
      role: writer
    - name: ops
      sha256: replace-me-with-the-sha256-of-the-ops-token
      role: admin
  # the keystore password (see the tls ConfigMap)
  PHOENIXGRAPH_TLS_PASSWORD: replace-me-keystore-password
