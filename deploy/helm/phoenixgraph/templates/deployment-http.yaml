apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-http
  labels:
    {{- include "phoenixgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.http.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "phoenixgraph.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "phoenixgraph.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /api/v1/metrics/prometheus
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: graph-http
          image: {{ .Values.image.http | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            {{- if .Values.security.enabled }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/etc/phoenixgraph/security.yml"
            {{- end }}
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseContainerSupport"
          resources:
            {{- toYaml .Values.http.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.security.enabled }}
            - name: security
              mountPath: /etc/phoenixgraph
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /api/v1/graphs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        {{- if .Values.security.enabled }}
        - name: security
          secret:
            secretName: {{ .Values.security.existingSecret }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
