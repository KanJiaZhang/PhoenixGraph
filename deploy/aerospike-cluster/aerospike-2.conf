# A node of the two-node drill cluster (see docker-compose.yml in this directory).
#
# Mounted at /opt/aerospike/etc/aerospike.conf and started with `asd --config-file ... --foreground`, because
# the image's entrypoint regenerates /etc/aerospike/aerospike.conf from its own template - which silently turns
# a cluster into a single-node "docker" instance. (It also rewrote a config mounted read-write, so this file is
# mounted where the entrypoint does not look.)
service {
  cluster-name phoenixgraph-drill
}

network {
  service {
    address any
    port 3000
  }
  fabric {
    address any
    port 3001
  }
  info {
    address any
    port 3003
  }
  heartbeat {
    mode mesh
    address any
    port 3002
    interval 150
    timeout 10
    # The seeds belong *here*. A `cluster { mesh-seed-address-port ... }` block looks plausible and is ignored
    # without a word: the symptom is cluster_size=1 with a replication factor that quietly degrades to 1.
    mesh-seed-address-port aerospike-1 3002
    mesh-seed-address-port aerospike-2 3002
  }
}

namespace test {
  # every record on two nodes: one node can be lost without losing data
  replication-factor 2
  # A file-backed memory namespace, which is the shape this image's own template uses for its "data in memory"
  # mode. Two knobs an older build knew are gone in 8.x and the server refuses to start on them:
  # `memory-size` ("obsolete") and `stop-writes-sys-memory-pct` ("unknown parameter").
  storage-engine memory {
    file /opt/aerospike/data/test.dat
    filesize 1G
  }
}

logging {
  # to stdout, so `docker logs` shows what the cluster is doing
  console {
    context any info
  }
}
